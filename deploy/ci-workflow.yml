name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, typecheck, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # better-sqlite3 v11 has no Node 24 prebuild, so it compiles from source.
      # ShellCheck backs the shell half of `npm run lint`.
      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y make g++ python3 shellcheck

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # The web Vitest config pins NODE_ENV=test; run it too with the brain's
      # inherited production env so React resolution regressions fail here.
      - name: Web tests with inherited NODE_ENV=production
        run: NODE_ENV=production npm test --workspace src/web

      - run: npm run build

      # Export hostile overrides to both proof steps so a regression that
      # spreads process.env into the brain or the MCP client fails here instead
      # of passing silently. None are real config. The two blocks are identical
      # on purpose; src/server/test/ci-workflow.test.ts fails if they drift.
      - name: E2E API workflow
        env:
          HOME: /nonexistent
          NODE_ENV: production
          SBOX_HARNESS: opencode
          SBOX_HARNESS_BIN: /bin/false
          SBOX_CLAUDE_BIN: /bin/false
          SBOX_PLUGINS_DIR: /nonexistent/host-plugins
          SBOX_BRAIN_URL: http://127.0.0.1:1
          SBOX_REQUEST_ID: hostile-request
          SBOX_TURN_TIMEOUT_MS: "1"
          APS_HARNESS: opencode
          APS_HARNESS_BIN: /bin/false
          APS_CLAUDE_BIN: /bin/false
          APS_PLUGINS_DIR: /nonexistent/host-plugins
          APS_BRAIN_URL: http://127.0.0.1:1
          APS_REQUEST_ID: hostile-request
          APS_TURN_TIMEOUT_MS: "1"
          APS_DEFAULT_MODEL: host/model
          ANTHROPIC_API_KEY: sk-hostile-not-real
          ANTHROPIC_BASE_URL: https://example.invalid
        run: node scripts/e2e.mjs

      - name: HTTP smoke
        run: ./scripts/smoke.sh

      - name: MCP stdio smoke
        env:
          HOME: /nonexistent
          NODE_ENV: production
          SBOX_HARNESS: opencode
          SBOX_HARNESS_BIN: /bin/false
          SBOX_CLAUDE_BIN: /bin/false
          SBOX_PLUGINS_DIR: /nonexistent/host-plugins
          SBOX_BRAIN_URL: http://127.0.0.1:1
          SBOX_REQUEST_ID: hostile-request
          SBOX_TURN_TIMEOUT_MS: "1"
          APS_HARNESS: opencode
          APS_HARNESS_BIN: /bin/false
          APS_CLAUDE_BIN: /bin/false
          APS_PLUGINS_DIR: /nonexistent/host-plugins
          APS_BRAIN_URL: http://127.0.0.1:1
          APS_REQUEST_ID: hostile-request
          APS_TURN_TIMEOUT_MS: "1"
          APS_DEFAULT_MODEL: host/model
          ANTHROPIC_API_KEY: sk-hostile-not-real
          ANTHROPIC_BASE_URL: https://example.invalid
        run: node scripts/mcp-smoke.mjs

      # Exits 0 without a claude binary; verifies the real CLI when one is installed.
      # Hostile sentinels prove the smoke's own binary discovery ignores inherited
      # production config; a regression that reads APS_CLAUDE_BIN runs /bin/false
      # and fails instead of skipping.
      - name: Claude mock smoke
        env:
          HOME: /nonexistent
          NODE_ENV: production
          SBOX_HARNESS: opencode
          SBOX_HARNESS_BIN: /bin/false
          SBOX_CLAUDE_BIN: /bin/false
          SBOX_PLUGINS_DIR: /nonexistent/host-plugins
          SBOX_BRAIN_URL: http://127.0.0.1:1
          SBOX_REQUEST_ID: hostile-request
          SBOX_TURN_TIMEOUT_MS: "1"
          APS_DB: /nonexistent/hostile.sqlite
          APS_DATA_DIR: /nonexistent/hostile-data
          APS_HARNESS: opencode
          APS_HARNESS_BIN: /bin/false
          APS_CLAUDE_BIN: /bin/false
          APS_PLUGINS_DIR: /nonexistent/host-plugins
          APS_BRAIN_URL: http://127.0.0.1:1
          APS_REQUEST_ID: hostile-request
          APS_TURN_TIMEOUT_MS: "1"
          APS_DEFAULT_MODEL: host/model
          ANTHROPIC_API_KEY: sk-hostile-not-real
          ANTHROPIC_BASE_URL: https://example.invalid
        run: node scripts/claude-mock-smoke.mjs
