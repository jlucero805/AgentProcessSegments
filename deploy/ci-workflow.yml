name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # better-sqlite3 v11 has no Node 24 prebuild, so it compiles from source.
      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y make g++ python3

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Export hostile overrides so a regression that spreads process.env into
      # the brain fails here instead of passing silently. None are real config.
      # These include the values from the original report plus stronger sentinels.
      - name: E2E API workflow
        env:
          HOME: /nonexistent
          NODE_ENV: production
          SBOX_HARNESS: opencode
          SBOX_HARNESS_BIN: /bin/false
          SBOX_CLAUDE_BIN: /bin/false
          SBOX_PLUGINS_DIR: /nonexistent/host-plugins
          SBOX_BRAIN_URL: http://127.0.0.1:1
          SBOX_TURN_TIMEOUT_MS: "1"
          APS_HARNESS: opencode
          APS_HARNESS_BIN: /bin/false
          APS_CLAUDE_BIN: /bin/false
          APS_PLUGINS_DIR: /nonexistent/host-plugins
          APS_BRAIN_URL: http://127.0.0.1:1
          APS_TURN_TIMEOUT_MS: "1"
          APS_DEFAULT_MODEL: host/model
          ANTHROPIC_API_KEY: sk-hostile-not-real
          ANTHROPIC_BASE_URL: https://example.invalid
        run: node scripts/e2e.mjs

      - name: HTTP smoke
        run: ./scripts/smoke.sh

      - name: MCP stdio smoke
        run: node scripts/mcp-smoke.mjs

      # Exits 0 without a claude binary; verifies the real CLI when one is installed.
      - name: Claude mock smoke
        run: node scripts/claude-mock-smoke.mjs
